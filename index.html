<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucralize · Resultados Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root{
    --coral:#F72642; --coral-dark:#8E1C41;
    --teal:#92DCE5; --teal-dark:#0C7488;
    --navy:#0E1428; --navy-2:#161D35;
    --ink-2:#AAB8C2; --ink-3:#7C8798;
    --line:rgba(255,255,255,.12);
    --success:#4FD1A5; --danger:#F7566B; --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',sans-serif; color:#fff;
    background:
      radial-gradient(ellipse 900px 700px at 8% 8%, #8E1C41 0%, rgba(142,28,65,0) 55%),
      radial-gradient(ellipse 1000px 800px at 100% 100%, #3A2A55 0%, rgba(58,42,85,0) 55%),
      var(--navy);
    background-attachment: fixed;
    min-height:100vh;
  }
  h1,h2,h3,.num{ font-family:'Manrope',sans-serif; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:rgba(14,20,40,.7); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand span{ font-size:13px; color:var(--ink-2); font-weight:500; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  select, .btn{ font-family:'Inter',sans-serif; font-size:13px; font-weight:500; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:8px; padding:8px 12px; color:#fff; cursor:pointer; }
  select option{ color:#000; }
  .btn:hover{ background:rgba(255,255,255,.14); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.primary{ background:var(--coral); border-color:var(--coral); color:#fff; }
  #status{ font-size:12px; color:var(--ink-3); margin-right:4px; }

  .stage-wrap{ max-width:960px; margin:28px auto; padding:0 20px 40px; transition:max-width .15s ease; }
  .stage-wrap.wide{ max-width:min(96vw, 1900px); }
  .slide{ min-height:520px; padding:56px 8px; display:none; flex-direction:column; justify-content:center; }
  .slide.active{ display:flex; }
  .eyebrow{ font-size:13px; color:var(--ink-3); margin:0 0 10px; letter-spacing:.02em; }
  .slide h1{ font-size:38px; font-weight:500; margin:0 0 14px; color:var(--teal); }
  .slide .lede{ font-size:17px; color:#fff; opacity:.85; margin:0 0 36px; max-width:680px; line-height:1.6; }
  .slide-body{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .slide-footnote{ font-size:12px; color:var(--ink-3); margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:32px; margin-bottom:16px; }
  .kpi{ padding:6px 0; }
  .kpi .label{ font-size:14px; color:var(--ink-2); margin:0 0 10px; }
  .kpi .num{ font-size:56px; font-weight:600; margin:0; color:#fff; line-height:1.05; }
  .kpi .num.up{ color:var(--success); }
  .kpi .num.down{ color:var(--danger); }
  .kpi .sub{ font-size:13px; color:var(--ink-3); margin:8px 0 0; }

  .card{ background:#fff; border-radius:12px; padding:28px 32px; color:#14181C; }
  .card + .card{ margin-top:16px; }

  table{ width:100%; border-collapse:collapse; font-size:15px; }
  .card table{ color:#14181C; }
  th,td{ text-align:right; padding:12px 14px; border-bottom:1px solid #E4E8EB; }
  th:first-child, td:first-child{ text-align:left; }
  thead th{ color:#5B6470; font-weight:500; font-size:13px; }
  tbody tr:last-child{ font-weight:700; }

  .month-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:40px 20px; }
  .month-tile{ text-align:center; }
  .month-tile .saldo{ font-weight:600; font-size:46px; font-family:'Manrope',sans-serif; }
  .month-tile .name{ font-weight:700; color:#fff; font-size:18px; margin-top:8px; }
  .month-tile .detail{ font-size:13.5px; color:var(--ink-2); margin-top:6px; }

  .nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin-top:18px; }
  .dots{ display:flex; gap:7px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; border:none; padding:0; }
  .dot.active{ background:var(--teal); }
  .nav .btn{ width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:50%; }

  .note{ font-size:13.5px; color:var(--ink-3); background:rgba(255,255,255,.06); border-radius:8px; padding:14px 18px; margin-top:18px; }

  .slide-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .slide-thumb-wrap{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:14px; border:1px solid var(--line); cursor:pointer; padding:0; background:var(--navy); transition:transform .15s ease, border-color .15s ease; display:block; }
  .slide-thumb-wrap:hover{ transform:translateY(-3px); border-color:var(--teal); }
  .slide-thumb-inner{ position:absolute; top:0; left:0; width:960px; height:540px; transform-origin:top left; pointer-events:none; }
  .slide-thumb-inner .slide{ min-height:540px; height:540px; }
  .slide-thumb-label{ position:absolute; bottom:0; left:0; right:0; padding:6px 10px; font-size:11px; color:var(--ink-2); background:linear-gradient(transparent, rgba(0,0,0,.55)); }

  .single-toolbar{ display:flex; margin-bottom:8px; }

  body.fullscreen-mode .topbar{ display:none; }
  body.fullscreen-mode .stage-wrap{ max-width:none; margin:0; padding:40px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  body.fullscreen-mode .single-toolbar{ display:none; }

  @media print{
    .topbar, .nav, .slide-grid, .single-toolbar{ display:none !important; }
    body{ background:var(--navy) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .stage-wrap{ margin:0; padding:0; max-width:none; }
    #singleView{ display:block !important; }
    .slide{ display:none !important; min-height:0; page-break-after:always; }
    .slide.active{ display:flex !important; }
  }
  @media (max-width:640px){
    .slide{ padding:28px 4px; }
    .slide h1{ font-size:26px; }
    .topbar{ padding:12px 16px; flex-wrap:wrap; gap:10px; }
    .slide-grid{ grid-template-columns:1fr; }
    .stage-wrap.wide{ max-width:960px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round"><path d="M6 20 L6 8 M10 20 L10 5 M14 20 L14 10 L6 18"/></svg>
      <span style="color:var(--teal);font-weight:600;font-family:'Manrope',sans-serif">lucralize</span>
      <span style="opacity:.5">·</span>
      <span>Resultados mensais</span>
    </div>
    <div class="topbar-right">
      <span id="status">carregando…</span>
      <select id="monthSelect"></select>
      <button class="btn" id="refreshBtn" title="Força nova busca no Agendor e no SharePoint (pode levar 1-2 min)">Atualizar dados</button>
      <button class="btn primary" id="presentBtn">▸ Apresentar</button>
      <button class="btn" id="printBtn">Exportar PDF</button>
      <button class="btn" id="pptxBtn">Exportar PPTX</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div id="slideGrid" class="slide-grid"></div>
    <div id="singleView" style="display:none">
      <div class="single-toolbar">
        <button class="btn" id="backToGridBtn">← Voltar</button>
      </div>
      <div id="slides"></div>
      <div class="nav">
        <button class="btn" id="prevBtn">←</button>
        <div class="dots" id="dots"></div>
        <button class="btn" id="nextBtn">→</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const PROXY = 'https://dashboard-proxy-production-ebff.up.railway.app';
const META_TRIMESTRE = { 1: 525, 2: 600, 3: 675, 4: 750 };
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const FUNIS_LEAD = ['Funil Comercial'];

let DEALS = [];
let rawContab = [], rawTech = [];
let selectedMonthKey = null;
let slideIndex = 0;
let REPORT = null; // snapshot dos dados computados no último render(), usado pelo export PPTX

// ===================== FIELD HELPERS (mesmos do Gestão Comercial) =====================
function fv(r,...keys){ for(const k of keys) if(r[k]!==undefined && r[k]!==null && r[k]!=='') return String(r[k]); return ''; }
function getSituacao(r){ return (r['Situa_x00e7__x00e3_o']||r['Situ_x00e7__x00e3_o']||r.Situacao||r['Situação']||'').toUpperCase(); }
function safeYM(val){ if(!val) return null; const s=String(val).trim(); if(s.includes('/')){ const p=s.split('/'); if(p.length===2 && p[1].length===4) return `${p[1]}-${p[0].padStart(2,'0')}`; } if(s.match(/^\d{4}-\d{2}/)) return s.substring(0,7); return null; }
function getEntradaYM_contab(r){ const v=fv(r,'DatadoContrato','Data_x0020_do_x0020_Contrato','DataDoContrato'); if(!v) return null; try{ const d=new Date(v); if(!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }catch{} return safeYM(v); }
function getSaidaYM_contab(r){ const sit=getSituacao(r); if(sit!=='INATIVO' && sit!=='BAIXADA' && sit!=='EM CANCELAMENTO') return null; return safeYM(fv(r,'Compet_x00ea_nciadeSa_x00ed_da','Compet_x00ea_nciadeSa_x00ed_a')); }
function getEntradaYM_tech(r){ const f=fv(r,'field_11','Compet_x00ea_ncia','Competência'); if(f) return safeYM(f); if(r.Created){ try{ const d=new Date(r.Created); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }catch{} } return null; }
function getSaidaYM_tech(r){ const sit=getSituacao(r); if(sit!=='INATIVO' && sit!=='BAIXADA' && sit!=='EM CANCELAMENTO') return null; const f=r['field_26']; if(!f) return null; const s=String(f).trim(); if(/^\d{2}\/\d{4}$/.test(s)) return safeYM(s); return null; }
function getHonorario(r){ return parseFloat(fv(r,'Honor_x00e1_rio','Honorário','Honorario'))||0; }
function getValorTech(r){ return parseFloat(fv(r,'Valor'))||0; }

function monthKey(dateStr){ if(!dateStr) return null; return dateStr.slice(0,7); }
function fmtMonthLabel(key){ const [y,m]=key.split('-'); return MESES[parseInt(m,10)-1] + ' ' + y; }
function quarterOf(monthIdx){ return Math.floor(monthIdx/3)+1; }
function fmtBRL(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); }
function addMonth(k){ let [y,m]=k.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; }

// Sequência completa de meses (sem buracos) entre o mais antigo e o mais recente evento —
// meses sem nenhuma entrada/saída não somem da lista, só ficam zerados.
function fullMonthRange(){
  const keys = new Set();
  rawContab.forEach(r=>{ const e=getEntradaYM_contab(r); if(e) keys.add(e); const s=getSaidaYM_contab(r); if(s) keys.add(s); });
  rawTech.forEach(r=>{ const e=getEntradaYM_tech(r); if(e) keys.add(e); const s=getSaidaYM_tech(r); if(s) keys.add(s); });
  const sorted = Array.from(keys).filter(Boolean).sort();
  if(!sorted.length) return [];
  const out = [];
  let k = sorted[0];
  const max = sorted[sorted.length-1];
  while(k <= max){ out.push(k); k = addMonth(k); }
  return out;
}

// ===================== BOOT =====================
async function loadData(){
  document.getElementById('status').textContent = 'carregando…';
  try{
    const [dealsRes, clientesRes] = await Promise.all([
      fetch(PROXY + '/deals').then(r=>r.json()).catch(()=>({data:[]})),
      fetch(PROXY + '/clientes').then(r=>r.json())
    ]);
    DEALS = dealsRes.data || [];
    rawContab = clientesRes.contabilidade || [];
    rawTech = clientesRes.tech || [];
    document.getElementById('status').textContent = clientesRes.updated_at ? ('atualizado ' + new Date(clientesRes.updated_at).toLocaleString('pt-BR')) : 'sem dados ainda — clique em Atualizar';
    buildMonthOptions();
    render();
  }catch(e){
    document.getElementById('status').textContent = 'erro ao carregar — confira o console';
    console.error(e);
  }
}

function buildMonthOptions(){
  const sorted = fullMonthRange().slice().reverse();
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  sorted.forEach(k=>{ const opt=document.createElement('option'); opt.value=k; opt.textContent=fmtMonthLabel(k); sel.appendChild(opt); });
  if(!selectedMonthKey || !sorted.includes(selectedMonthKey)) selectedMonthKey = sorted[0];
  sel.value = selectedMonthKey;
}

// ===================== AGREGAÇÕES (SharePoint = fonte de entradas/saídas/ativos) =====================
function monthlyEntradasSaidas(){
  const out = {};
  fullMonthRange().forEach(k=>{ out[k] = {entradas:0,saidas:0,tech:0,pmes:0}; });
  const add = (k, field) => { if(!k || !out[k]) return; out[k][field]++; };
  rawContab.forEach(r=>{
    const e=getEntradaYM_contab(r); if(e && out[e]){ add(e,'entradas'); out[e].pmes++; }
    const s=getSaidaYM_contab(r); if(s) add(s,'saidas');
  });
  rawTech.forEach(r=>{
    const e=getEntradaYM_tech(r); if(e && out[e]){ add(e,'entradas'); out[e].tech++; }
    const s=getSaidaYM_tech(r); if(s) add(s,'saidas');
  });
  return out;
}
function ativosSnapshot(monthK){
  const ativosC = rawContab.filter(r=>{ const e=getEntradaYM_contab(r); if(!e||e>monthK) return false; const s=getSaidaYM_contab(r); return !(s && s<=monthK); });
  const ativosT = rawTech.filter(r=>{ const e=getEntradaYM_tech(r); if(!e||e>monthK) return false; const s=getSaidaYM_tech(r); return !(s && s<=monthK); });
  const mrr = ativosC.reduce((s,r)=>s+getHonorario(r),0) + ativosT.reduce((s,r)=>s+getValorTech(r),0);
  const total = ativosC.length + ativosT.length;
  return { total, tech:ativosT.length, contab:ativosC.length, mrr, ticket: total ? mrr/total : 0 };
}
function funilLeadsNoMes(monthK){
  let leads=0, fechamentos=0;
  DEALS.forEach(d=>{
    const fn = (d.dealStage && d.dealStage.funnel && d.dealStage.funnel.name) || '';
    if(FUNIS_LEAD.some(f=>fn.toLowerCase().includes(f.toLowerCase()))){
      if(monthKey(d.createdAt)===monthK) leads++;
      if(d.wonAt && monthKey(d.wonAt)===monthK) fechamentos++;
    }
  });
  return { leads, fechamentos, conversao: leads ? (fechamentos/leads*100) : 0 };
}

// ===================== RENDER =====================
function render(){
  const agg = monthlyEntradasSaidas();
  const allKeys = Object.keys(agg).sort();
  const idx = allKeys.indexOf(selectedMonthKey);
  const prevKey = idx>0 ? allKeys[idx-1] : null;
  const cur = agg[selectedMonthKey] || {entradas:0,saidas:0,tech:0,pmes:0};
  const prev = prevKey ? agg[prevKey] : null;
  const saldo = cur.entradas - cur.saidas;
  const [y,m] = selectedMonthKey.split('-');
  const monthIdx = parseInt(m,10)-1;
  const trimestre = quarterOf(monthIdx);

  const ativos = ativosSnapshot(selectedMonthKey);
  const prevMonthKey = allKeys.filter(k=>k<selectedMonthKey).pop();
  const ativosPrev = prevMonthKey ? ativosSnapshot(prevMonthKey) : null;

  const funil = funilLeadsNoMes(selectedMonthKey);

  let saldoAcumuladoAno = 0;
  allKeys.filter(k=>k.startsWith(y) && k<=selectedMonthKey).forEach(k=>{ saldoAcumuladoAno += (agg[k].entradas - agg[k].saidas); });

  const semestreKeysForExport = allKeys.filter(k=>k.startsWith(y)).slice(-6);
  const anoKeysForExport = allKeys.filter(k=>k.startsWith(y));
  const pctAnoForExport = (ativos.total / 750 * 100);

  REPORT = {
    y, monthIdx, trimestre, cur, prev, prevKey, saldo,
    ativos, ativosPrev, funil, saldoAcumuladoAno, pctAno: pctAnoForExport,
    semestreKeys: semestreKeysForExport,
    anoKeys: anoKeysForExport,
    agg,
    monthLabel: fmtMonthLabel(selectedMonthKey)
  };

  const slidesHtml = [];

  // Slide 1 — capa
  slidesHtml.push(`
    <div class="eyebrow">COMERCIAL</div>
    <h1>Resultados ${fmtMonthLabel(selectedMonthKey)}</h1>
    <p class="lede">${trimestre}º trimestre de ${y}</p>
  `);

  // Slide 2 — o que aconteceu
  slidesHtml.push(`
    <div class="eyebrow">Slide 2</div>
    <h1>O que aconteceu em ${MESES[monthIdx]}</h1>
    <p class="lede">Comparativo com ${prevKey ? fmtMonthLabel(prevKey) : 'o mês anterior'}.</p>
    <div class="slide-body">
      <div class="kpis">
        <div class="kpi"><p class="label">Novos clientes</p><p class="num up">+${cur.entradas}</p>${prev?`<p class="sub">${prevKey.slice(5)}: ${prev.entradas}</p>`:''}</div>
        <div class="kpi"><p class="label">Saídas</p><p class="num down">-${cur.saidas}</p>${prev?`<p class="sub">${prevKey.slice(5)}: ${prev.saidas}</p>`:''}</div>
        <div class="kpi"><p class="label">Saldo do mês</p><p class="num">${saldo>=0?'+':''}${saldo}</p></div>
      </div>
      <div class="note">Mix de produto (fonte SharePoint): ${cur.tech} Tech, ${cur.pmes} PMEs.</div>
    </div>
  `);

  // Slide 3 — vendas por produto no semestre
  const semestreKeys = allKeys.filter(k=>k.startsWith(y)).slice(-6);
  let rowTech='<tr><td>Lucralize Tech</td>', rowPmes='<tr><td>Contabilidade PMEs</td>', rowTotal='<tr><td>Total</td>';
  let totTech=0, totPmes=0;
  semestreKeys.forEach(k=>{
    const a = agg[k] || {tech:0,pmes:0};
    totTech+=a.tech; totPmes+=a.pmes;
    rowTech+=`<td>${a.tech}</td>`; rowPmes+=`<td>${a.pmes}</td>`; rowTotal+=`<td>${a.tech+a.pmes}</td>`;
  });
  rowTech+=`<td>${totTech}</td></tr>`; rowPmes+=`<td>${totPmes}</td></tr>`; rowTotal+=`<td>${totTech+totPmes}</td></tr>`;
  slidesHtml.push(`
    <div class="eyebrow">Slide 3</div>
    <h1>Vendas por produto no semestre</h1>
    <p class="lede">Entradas por mês, listas "Controle de Clientes" e "Base de Usuários" (SharePoint).</p>
    <div class="slide-body">
      <div class="card">
        <table>
          <thead><tr><th>Produto</th>${semestreKeys.map(k=>`<th>${MESES[parseInt(k.slice(5),10)-1].slice(0,3)}</th>`).join('')}<th>Total</th></tr></thead>
          <tbody>${rowTech}${rowPmes}${rowTotal}</tbody>
        </table>
      </div>
    </div>
  `);

  // Slide 4 — como estamos
  slidesHtml.push(`
    <div class="eyebrow">Slide 4</div>
    <h1>Como estamos em ${y}</h1>
    <p class="lede">Base de clientes ativos ao fim de ${MESES[monthIdx]}.</p>
    <div class="slide-body">
      <div class="kpis">
        <div class="kpi"><p class="label">Clientes ativos</p><p class="num">${ativos.total}</p>${ativosPrev?`<p class="sub">${ativos.total-ativosPrev.total>=0?'+':''}${ativos.total-ativosPrev.total} vs mês anterior</p>`:''}</div>
        <div class="kpi"><p class="label">Tech / Contabilidade</p><p class="num">${ativos.tech} / ${ativos.contab}</p></div>
        <div class="kpi"><p class="label">MRR consolidado</p><p class="num">${fmtBRL(ativos.mrr)}</p></div>
        <div class="kpi"><p class="label">Ticket médio</p><p class="num">${fmtBRL(ativos.ticket)}</p></div>
      </div>
    </div>
  `);

  // Slide 5 — clientes mês a mês
  const anoKeys = allKeys.filter(k=>k.startsWith(y));
  const monthRows = anoKeys.map(k=>{
    const a = agg[k]; const s = a.entradas-a.saidas;
    return `<div class="month-tile"><div class="saldo" style="color:${s>=0?'var(--success)':'var(--danger)'}">${s>=0?'+':''}${s}</div><div class="name">${MESES[parseInt(k.slice(5),10)-1]}</div><div class="detail">${a.entradas} entradas e ${a.saidas} saídas</div></div>`;
  }).join('');
  slidesHtml.push(`
    <div class="eyebrow">Slide 5</div>
    <h1>Clientes mês a mês em ${y}</h1>
    <p class="lede">O saldo de cada mês, com entradas e saídas lado a lado.</p>
    <div class="slide-body"><div class="month-grid">${monthRows || '<p class="note">Sem dados suficientes ainda.</p>'}</div></div>
  `);

  // Slide 6 — funil de leads (Agendor)
  slidesHtml.push(`
    <div class="eyebrow">Slide 6</div>
    <h1>Funil de leads em ${MESES[monthIdx]}</h1>
    <p class="lede">Funil Comercial no Agendor — volume e conversão do mês.</p>
    <div class="slide-body">
      <div class="kpis">
        <div class="kpi"><p class="label">Leads no mês</p><p class="num">${funil.leads}</p></div>
        <div class="kpi"><p class="label">Fechamentos</p><p class="num">${funil.fechamentos}</p></div>
        <div class="kpi"><p class="label">Conversão</p><p class="num">${funil.conversao.toFixed(1)}%</p></div>
      </div>
      <div class="note">Origem do lead e reuniões agendadas pelo Luca ainda pendentes de mapeamento de campo.</div>
    </div>
  `);

  // Slide 7 — meta 2026
  const pctAno = (ativos.total / 750 * 100);
  slidesHtml.push(`
    <div class="eyebrow">Slide 7</div>
    <h1>A meta 2026 em números</h1>
    <p class="lede">750 clientes ativos até dezembro (meta fixa, racionada por trimestre).</p>
    <div class="slide-body">
      <div class="kpis">
        <div class="kpi"><p class="label">Clientes ativos hoje</p><p class="num">${ativos.total}</p></div>
        <div class="kpi"><p class="label">Meta de dezembro</p><p class="num">750</p></div>
        <div class="kpi"><p class="label">% da meta anual</p><p class="num">${pctAno.toFixed(0)}%</p></div>
      </div>
    </div>
  `);

  // Slide 8 — meta vs realizado vs gap
  let metaRows = '';
  [1,2,3,4].forEach(q=>{
    const status = q<trimestre ? 'fechado' : (q===trimestre ? 'em andamento' : '');
    const gap = ativos.total - META_TRIMESTRE[q];
    metaRows += `<tr><td>${q}º trimestre ${status?`(${status})`:''}</td><td>${META_TRIMESTRE[q]}</td><td>${ativos.total}</td><td>${gap>=0?'+':''}${gap}</td></tr>`;
  });
  slidesHtml.push(`
    <div class="eyebrow">Slide 8</div>
    <h1>Meta vs. realizado vs. GAP</h1>
    <p class="lede">Checkpoints trimestrais fixos da premiação (525 / 600 / 675 / 750).</p>
    <div class="slide-body">
      <div class="card">
        <table><thead><tr><th>Trimestre</th><th>Meta (faixa 1)</th><th>Base de clientes</th><th>GAP</th></tr></thead><tbody>${metaRows}</tbody></table>
      </div>
      <div class="note">"Base de clientes" usa o total de ativos hoje para todos os trimestres — para ver o valor histórico de cada trimestre passado, selecione o mês de fechamento dele.</div>
    </div>
  `);

  document.getElementById('slides').innerHTML = slidesHtml.map((h,i)=>`<div class="slide${i===0?' active':''}" data-i="${i}">${h}</div>`).join('');
  buildDots(slidesHtml.length);
  renderGrid(slidesHtml);
  if(viewMode==='grid') document.querySelector('.stage-wrap').classList.add('wide');
  goToSlide(0);
}

function renderGrid(slidesHtml){
  const grid = document.getElementById('slideGrid');
  grid.innerHTML = slidesHtml.map((h,i)=>{
    const m = h.match(/<div class="eyebrow">(.*?)<\/div>\s*<h1>(.*?)<\/h1>/s);
    const label = m ? m[2] : `Slide ${i+1}`;
    return `<button class="slide-thumb-wrap" data-i="${i}"><div class="slide-thumb-inner"><div class="slide active">${h}</div></div><div class="slide-thumb-label">${label}</div></button>`;
  }).join('');
  grid.querySelectorAll('.slide-thumb-wrap').forEach(btn=>{
    btn.addEventListener('click', ()=>openSingle(parseInt(btn.dataset.i,10), false));
  });
  scaleThumbs();
}
function scaleThumbs(){
  document.querySelectorAll('.slide-thumb-wrap').forEach(wrap=>{
    const inner = wrap.querySelector('.slide-thumb-inner');
    if(!inner) return;
    const scale = wrap.clientWidth / 960;
    inner.style.transform = `scale(${scale})`;
  });
}
window.addEventListener('resize', ()=>{ if(viewMode==='grid') scaleThumbs(); });

let viewMode = 'grid';
let isPresenting = false;

function openSingle(i, fullscreen){
  viewMode = 'single';
  document.getElementById('slideGrid').style.display = 'none';
  document.getElementById('singleView').style.display = 'block';
  document.querySelector('.stage-wrap').classList.remove('wide');
  goToSlide(i);
  if(fullscreen){
    isPresenting = true;
    document.body.classList.add('fullscreen-mode');
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  }
}
function backToGrid(){
  if(document.fullscreenElement) document.exitFullscreen();
  document.body.classList.remove('fullscreen-mode');
  isPresenting = false;
  viewMode = 'grid';
  document.getElementById('slideGrid').style.display = 'grid';
  document.getElementById('singleView').style.display = 'none';
  document.querySelector('.stage-wrap').classList.add('wide');
  scaleThumbs();
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && isPresenting) backToGrid();
});

// ===================== EXPORT PPTX =====================
async function exportPPTX(){
  if(!REPORT){ return; }
  const btn = document.getElementById('pptxBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Gerando…'; btn.disabled = true;
  try{
    const R = REPORT;
    const NAVY = '0E1428', TEAL = '92DCE5', CORAL = 'F72642', WHITE = 'FFFFFF', MUTED = 'AAB8C2', SUCCESS='4FD1A5', DANGER='F7566B';
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'LUCRALIZE', width: 10, height: 5.625 });
    pptx.layout = 'LUCRALIZE';

    function baseSlide(){
      const s = pptx.addSlide();
      s.background = { color: NAVY };
      return s;
    }
    function header(s, eyebrow, title, lede){
      s.addText(eyebrow.toUpperCase(), { x:0.5, y:0.35, w:9, h:0.3, fontSize:11, color:MUTED, fontFace:'Arial', charSpacing:1 });
      s.addText(title, { x:0.5, y:0.62, w:9, h:0.6, fontSize:26, color:TEAL, bold:false, fontFace:'Arial' });
      if(lede){
        s.addText(lede, { x:0.5, y:1.18, w:8.5, h:0.5, fontSize:13, color:WHITE, fontFace:'Arial' });
      }
    }
    function kpiRow(s, kpis, y){
      const w = 9 / kpis.length;
      kpis.forEach((k, i)=>{
        const x = 0.5 + i*w;
        s.addText(k.label, { x, y, w:w-0.2, h:0.3, fontSize:11, color:MUTED, fontFace:'Arial' });
        s.addText(k.value, { x, y:y+0.3, w:w-0.2, h:0.55, fontSize:30, bold:true, color:k.color||WHITE, fontFace:'Arial' });
        if(k.sub) s.addText(k.sub, { x, y:y+0.85, w:w-0.2, h:0.3, fontSize:10, color:MUTED, fontFace:'Arial' });
      });
    }
    function tableSlide(s, y, rows, colWidths){
      s.addTable(rows, { x:0.5, y, w:9, colW:colWidths, fontSize:10, fontFace:'Arial', color:'14181C',
        fill:{color:WHITE}, border:{type:'solid', color:'E4E8EB', pt:0.5}, autoPage:false });
    }

    // Slide 1 — capa
    let s = baseSlide();
    s.addText('COMERCIAL', { x:0.5, y:2.1, w:9, h:0.3, fontSize:12, color:MUTED, fontFace:'Arial' });
    s.addText(`Resultados ${R.monthLabel}`, { x:0.5, y:2.4, w:9, h:0.8, fontSize:40, color:WHITE, bold:true, fontFace:'Arial' });
    s.addText(`${R.trimestre}º trimestre de ${R.y}`, { x:0.5, y:3.15, w:9, h:0.4, fontSize:15, color:TEAL, fontFace:'Arial' });

    // Slide 2 — o que aconteceu
    s = baseSlide();
    header(s, 'Slide 2', `O que aconteceu em ${MESES[R.monthIdx]}`, `Comparativo com ${R.prevKey ? fmtMonthLabel(R.prevKey) : 'o mês anterior'}.`);
    kpiRow(s, [
      { label:'Novos clientes', value:`+${R.cur.entradas}`, color:SUCCESS, sub:R.prev?`${R.prevKey.slice(5)}: ${R.prev.entradas}`:'' },
      { label:'Saídas', value:`-${R.cur.saidas}`, color:DANGER, sub:R.prev?`${R.prevKey.slice(5)}: ${R.prev.saidas}`:'' },
      { label:'Saldo do mês', value:`${R.saldo>=0?'+':''}${R.saldo}` }
    ], 2.0);
    s.addText(`Mix de produto (fonte SharePoint): ${R.cur.tech} Tech, ${R.cur.pmes} PMEs.`, { x:0.5, y:3.6, w:9, h:0.4, fontSize:11, color:MUTED, fontFace:'Arial' });

    // Slide 3 — vendas por produto no semestre
    s = baseSlide();
    header(s, 'Slide 3', 'Vendas por produto no semestre', 'Entradas por mês, listas "Controle de Clientes" e "Base de Usuários" (SharePoint).');
    {
      const head = [{text:'Produto', options:{bold:true, fill:{color:'F5F7F8'}}}].concat(
        R.semestreKeys.map(k=>({text:MESES[parseInt(k.slice(5),10)-1].slice(0,3), options:{bold:true, fill:{color:'F5F7F8'}}}))
      ).concat([{text:'Total', options:{bold:true, fill:{color:'F5F7F8'}}}]);
      let totTech=0, totPmes=0;
      const rowTech=['Lucralize Tech'], rowPmes=['Contabilidade PMEs'];
      R.semestreKeys.forEach(k=>{ const a=R.agg[k]||{tech:0,pmes:0}; totTech+=a.tech; totPmes+=a.pmes; rowTech.push(String(a.tech)); rowPmes.push(String(a.pmes)); });
      rowTech.push(String(totTech)); rowPmes.push(String(totPmes));
      const rows = [head, rowTech, rowPmes];
      tableSlide(s, 1.9, rows, [2].concat(R.semestreKeys.map(()=>1)).concat([1]));
    }

    // Slide 4 — como estamos
    s = baseSlide();
    header(s, 'Slide 4', `Como estamos em ${R.y}`, `Base de clientes ativos ao fim de ${MESES[R.monthIdx]}.`);
    kpiRow(s, [
      { label:'Clientes ativos', value:String(R.ativos.total), sub: R.ativosPrev?`${R.ativos.total-R.ativosPrev.total>=0?'+':''}${R.ativos.total-R.ativosPrev.total} vs mês anterior`:'' },
      { label:'Tech / Contabilidade', value:`${R.ativos.tech} / ${R.ativos.contab}` },
      { label:'MRR consolidado', value: fmtBRL(R.ativos.mrr) },
      { label:'Ticket médio', value: fmtBRL(R.ativos.ticket) }
    ], 2.0);

    // Slide 5 — clientes mês a mês
    s = baseSlide();
    header(s, 'Slide 5', `Clientes mês a mês em ${R.y}`, 'O saldo de cada mês, com entradas e saídas lado a lado.');
    {
      const cols = 4;
      R.anoKeys.forEach((k,i)=>{
        const a = R.agg[k]; const sVal = a.entradas-a.saidas;
        const col = i % cols, row = Math.floor(i/cols);
        const x = 0.5 + col*2.25, y = 2.0 + row*1.15;
        s.addText(`${sVal>=0?'+':''}${sVal}`, { x, y, w:2.0, h:0.5, fontSize:24, bold:true, color: sVal>=0?SUCCESS:DANGER, align:'center', fontFace:'Arial' });
        s.addText(MESES[parseInt(k.slice(5),10)-1], { x, y:y+0.45, w:2.0, h:0.3, fontSize:12, bold:true, color:WHITE, align:'center', fontFace:'Arial' });
        s.addText(`${a.entradas} ent. / ${a.saidas} saí.`, { x, y:y+0.7, w:2.0, h:0.3, fontSize:9, color:MUTED, align:'center', fontFace:'Arial' });
      });
    }

    // Slide 6 — funil de leads
    s = baseSlide();
    header(s, 'Slide 6', `Funil de leads em ${MESES[R.monthIdx]}`, 'Funil Comercial no Agendor — volume e conversão do mês.');
    kpiRow(s, [
      { label:'Leads no mês', value:String(R.funil.leads) },
      { label:'Fechamentos', value:String(R.funil.fechamentos) },
      { label:'Conversão', value:`${R.funil.conversao.toFixed(1)}%` }
    ], 2.0);

    // Slide 7 — meta 2026
    s = baseSlide();
    header(s, 'Slide 7', 'A meta 2026 em números', '750 clientes ativos até dezembro (meta fixa, racionada por trimestre).');
    kpiRow(s, [
      { label:'Clientes ativos hoje', value:String(R.ativos.total) },
      { label:'Meta de dezembro', value:'750' },
      { label:'% da meta anual', value:`${R.pctAno.toFixed(0)}%` }
    ], 2.0);

    // Slide 8 — meta vs realizado vs gap
    s = baseSlide();
    header(s, 'Slide 8', 'Meta vs. realizado vs. GAP', 'Checkpoints trimestrais fixos da premiação (525 / 600 / 675 / 750).');
    {
      const head = [{text:'Trimestre',options:{bold:true,fill:{color:'F5F7F8'}}},{text:'Meta (faixa 1)',options:{bold:true,fill:{color:'F5F7F8'}}},{text:'Base de clientes',options:{bold:true,fill:{color:'F5F7F8'}}},{text:'GAP',options:{bold:true,fill:{color:'F5F7F8'}}}];
      const rows = [head];
      [1,2,3,4].forEach(q=>{
        const status = q<R.trimestre ? ' (fechado)' : (q===R.trimestre ? ' (em andamento)' : '');
        const gap = R.ativos.total - META_TRIMESTRE[q];
        rows.push([`${q}º trimestre${status}`, String(META_TRIMESTRE[q]), String(R.ativos.total), `${gap>=0?'+':''}${gap}`]);
      });
      tableSlide(s, 1.9, rows, [3,2,2,2]);
    }

    await pptx.writeFile({ fileName: `Resultados_${R.monthLabel.replace(' ','_')}.pptx` });
  }catch(e){
    console.error(e);
    alert('Erro ao gerar o PPTX — confira o console.');
  }finally{
    btn.textContent = originalText; btn.disabled = false;
  }
}

function buildDots(n){
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  for(let i=0;i<n;i++){ const b=document.createElement('button'); b.className='dot'+(i===0?' active':''); b.onclick=()=>goToSlide(i); dots.appendChild(b); }
}
function goToSlide(i){
  const slides = document.querySelectorAll('#slides .slide');
  slideIndex = Math.max(0, Math.min(i, slides.length-1));
  slides.forEach((s,idx)=>s.classList.toggle('active', idx===slideIndex));
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active', idx===slideIndex));
  document.getElementById('prevBtn').disabled = slideIndex===0;
  document.getElementById('nextBtn').disabled = slideIndex===slides.length-1;
}

document.getElementById('monthSelect').addEventListener('change', e=>{ selectedMonthKey = e.target.value; render(); });
document.getElementById('prevBtn').addEventListener('click', ()=>goToSlide(slideIndex-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goToSlide(slideIndex+1));
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
document.getElementById('pptxBtn').addEventListener('click', exportPPTX);
document.getElementById('presentBtn').addEventListener('click', ()=>openSingle(0, true));
document.getElementById('backToGridBtn').addEventListener('click', backToGrid);
document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  document.getElementById('status').textContent = 'atualizando…';
  await Promise.all([
    fetch(PROXY + '/refresh', {method:'POST'}).catch(()=>{}),
    fetch(PROXY + '/clientes/refresh', {method:'POST'}).catch(()=>{})
  ]);
  setTimeout(loadData, 15000);
});
document.addEventListener('keydown', e=>{
  if(viewMode!=='single') return;
  if(e.key==='ArrowRight') goToSlide(slideIndex+1);
  if(e.key==='ArrowLeft') goToSlide(slideIndex-1);
  if(e.key==='Escape' && !document.fullscreenElement) backToGrid();
});

loadData();
</script>
